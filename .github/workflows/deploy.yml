# Builds the web version and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings > Pages > Source: GitHub Actions.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The checks first: a broken build or a failing test must not be published
      - run: npx tsc --noEmit
      - run: npm test

      # The site lives under /dramaflash-mockup on GitHub Pages (see app.config.js)
      - run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /dramaflash-mockup

      # GitHub Pages shows 404.html for a path it does not know (a deep link or a reload).
      # Serving the app's own page there lets the router show the right screen.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
